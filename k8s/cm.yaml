apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;

        # Serve React frontend
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # Proxy /api/* to FastAPI backend via K8s Service DNS
        location /api/ {
            proxy_pass http://hello-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
